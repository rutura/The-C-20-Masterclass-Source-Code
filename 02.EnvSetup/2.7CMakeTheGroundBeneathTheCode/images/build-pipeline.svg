<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE svg PUBLIC "-//W3C//DTD SVG 1.1//EN" "http://www.w3.org/Graphics/SVG/1.1/DTD/svg11.dtd">
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" width="1250px" height="410px" viewBox="-0.5 -0.5 1250 410" font-family="Helvetica"><defs/><g>

<!-- CMakeLists.txt -->
<rect x="40" y="40" width="160" height="60" rx="12" ry="12" fill="#dae8fc" stroke="#6c8ebf" pointer-events="all"/>
<text x="120" y="75" fill="#000000" font-size="13px" text-anchor="middle">CMakeLists.txt</text>

<!-- cmake -B build -->
<rect x="260" y="40" width="200" height="60" rx="12" ry="12" fill="#ffe6cc" stroke="#d79b00" pointer-events="all"/>
<text x="360" y="65" fill="#000000" font-size="13px" text-anchor="middle">cmake -B build</text>
<text x="360" y="82" fill="#000000" font-size="12px" text-anchor="middle">(generates build files)</text>

<!-- Ninja build files -->
<rect x="520" y="40" width="160" height="60" rx="12" ry="12" fill="#dae8fc" stroke="#6c8ebf" pointer-events="all"/>
<text x="600" y="75" fill="#000000" font-size="13px" text-anchor="middle">Ninja build files</text>

<!-- main.cpp -->
<rect x="40" y="220" width="160" height="60" rx="12" ry="12" fill="#dae8fc" stroke="#6c8ebf" pointer-events="all"/>
<text x="120" y="255" fill="#000000" font-size="13px" text-anchor="middle">main.cpp</text>

<!-- compiler -->
<rect x="260" y="220" width="200" height="60" rx="12" ry="12" fill="#ffe6cc" stroke="#d79b00" pointer-events="all"/>
<text x="360" y="245" fill="#000000" font-size="13px" text-anchor="middle">compiler</text>
<text x="360" y="262" fill="#000000" font-size="12px" text-anchor="middle">(source -&gt; object code)</text>

<!-- main.o -->
<rect x="520" y="220" width="180" height="60" rx="12" ry="12" fill="#dae8fc" stroke="#6c8ebf" pointer-events="all"/>
<text x="610" y="255" fill="#000000" font-size="13px" text-anchor="middle">main.o (object file)</text>

<!-- standard library -->
<rect x="520" y="320" width="180" height="60" rx="12" ry="12" fill="#dae8fc" stroke="#6c8ebf" pointer-events="all"/>
<text x="610" y="345" fill="#000000" font-size="13px" text-anchor="middle">standard library</text>
<text x="610" y="362" fill="#000000" font-size="12px" text-anchor="middle">(pre-built code)</text>

<!-- linker -->
<rect x="770" y="255" width="220" height="70" rx="12" ry="12" fill="#ffe6cc" stroke="#d79b00" pointer-events="all"/>
<text x="880" y="285" fill="#000000" font-size="13px" text-anchor="middle">linker</text>
<text x="880" y="302" fill="#000000" font-size="12px" text-anchor="middle">(stitches object code + libraries)</text>

<!-- rooster -->
<rect x="1040" y="255" width="200" height="70" rx="12" ry="12" fill="#d5e8d4" stroke="#82b366" pointer-events="all"/>
<text x="1140" y="283" fill="#000000" font-size="13px" text-anchor="middle">rooster (or rooster.exe)</text>
<text x="1140" y="300" fill="#000000" font-size="12px" text-anchor="middle">runnable program</text>

<!-- edges: top row -->
<path d="M 200 70 L 253.63 70" fill="none" stroke="#000000" stroke-miterlimit="10"/>
<path d="M 258.88 70 L 251.88 73.5 L 253.63 70 L 251.88 66.5 Z" fill="#000000" stroke="#000000" stroke-miterlimit="10"/>

<path d="M 460 70 L 513.63 70" fill="none" stroke="#000000" stroke-miterlimit="10"/>
<path d="M 518.88 70 L 511.88 73.5 L 513.63 70 L 511.88 66.5 Z" fill="#000000" stroke="#000000" stroke-miterlimit="10"/>

<!-- edges: bottom row -->
<path d="M 200 250 L 253.63 250" fill="none" stroke="#000000" stroke-miterlimit="10"/>
<path d="M 258.88 250 L 251.88 253.5 L 253.63 250 L 251.88 246.5 Z" fill="#000000" stroke="#000000" stroke-miterlimit="10"/>

<path d="M 460 250 L 513.63 250" fill="none" stroke="#000000" stroke-miterlimit="10"/>
<path d="M 518.88 250 L 511.88 253.5 L 513.63 250 L 511.88 246.5 Z" fill="#000000" stroke="#000000" stroke-miterlimit="10"/>

<!-- main.o + libs -> linker -->
<path d="M 700 245 L 763.63 268" fill="none" stroke="#000000" stroke-miterlimit="10"/>
<path d="M 768.5 269.8 L 760.9 270.4 L 763.63 268 L 762.4 264.5 Z" fill="#000000" stroke="#000000" stroke-miterlimit="10"/>

<path d="M 700 350 L 763.63 313" fill="none" stroke="#000000" stroke-miterlimit="10"/>
<path d="M 768.4 310.2 L 764.4 316.9 L 763.63 313 L 760.1 311.2 Z" fill="#000000" stroke="#000000" stroke-miterlimit="10"/>

<!-- linker -> rooster -->
<path d="M 990 290 L 1033.63 290" fill="none" stroke="#000000" stroke-miterlimit="10"/>
<path d="M 1038.88 290 L 1031.88 293.5 L 1033.63 290 L 1031.88 286.5 Z" fill="#000000" stroke="#000000" stroke-miterlimit="10"/>

<!-- Ninja invokes compiler (dashed, down then right) -->
<path d="M 600 100 L 600 160 L 360 160 L 360 213.63" fill="none" stroke="#666666" stroke-miterlimit="10" stroke-dasharray="4 4"/>
<path d="M 360 218.88 L 356.5 211.88 L 360 213.63 L 363.5 211.88 Z" fill="#666666" stroke="#666666" stroke-miterlimit="10"/>
<text x="480" y="153" fill="#666666" font-size="11px" text-anchor="middle">invokes</text>

<!-- Ninja invokes linker (dashed) -->
<path d="M 640 100 L 640 180 L 880 180 L 880 248.63" fill="none" stroke="#666666" stroke-miterlimit="10" stroke-dasharray="4 4"/>
<path d="M 880 253.88 L 876.5 246.88 L 880 248.63 L 883.5 246.88 Z" fill="#666666" stroke="#666666" stroke-miterlimit="10"/>
<text x="760" y="173" fill="#666666" font-size="11px" text-anchor="middle">invokes</text>

</g></svg>
